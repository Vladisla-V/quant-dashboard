<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Quant Dashboard{% endblock %}</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cascadia-code@5/400.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cascadia-code@5/700.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  {% block head_extra %}{% endblock %}
</head>
<body>
  <div class="bg-grid"></div>

  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-name">Built by Vladislav Pavel</span>
    </a>
    <div class="topbar-tag">
      <span>{% block status %}SYS READY{% endblock %}</span>
      <span class="cursor" aria-hidden="true"></span>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>// EDUCATIONAL PET PROJECT - NOT INVESTMENT ADVICE</span>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
